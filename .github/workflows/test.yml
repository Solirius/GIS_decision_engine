# Runs the test suite on every pull request, and before every deploy (deploy.yml calls it).
# Nothing here signs in to Azure: the tests replace every Azure service with a fake.
name: Tests

on:
  pull_request:
  workflow_call:       # deploy.yml runs it first, and deploys only if it passes
  workflow_dispatch:   # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.4"   # the uv version the Dockerfile uses

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --python 3.12   # the Python version the image runs

      - name: Run the tests
        run: uv run --frozen pytest -q
